[build]
  publish = "Meu Portofolio"
  command = ""

# Cache longo para assets (fotos, css, js) — o HTML continua sempre atualizado
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
